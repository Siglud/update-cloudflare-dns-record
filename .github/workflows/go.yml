# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  # Manual trigger remains available
  workflow_dispatch: {}
  # Auto-run when a new Release is published
  release:
    types: [published]

permissions:
  contents: write

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        # For release and tag events, this will checkout the exact tag ref
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '>=1.22.1'

    - name: Build
      run: CGO_ENABLED=0 go build -v ./...

    - name: Release
      uses: softprops/action-gh-release@v2
      # Only publish a release when running from a tag
      if: startsWith(github.ref, 'refs/tags/')
      with:
        body_path: ${{ github.workspace }}/CHANGELOG.txt
        token: ${{ secrets.GITHUB_TOKEN }}
        files: updateCloudflareDns
